import org.mtr.mapping.BuildTools

plugins {
	id "java"
	// Unobfuscated MC 26.1+
	id "net.fabricmc.fabric-loom" version "1.17-SNAPSHOT" apply false
}

subprojects {
	apply plugin: "java"
	apply plugin: "net.fabricmc.fabric-loom"

	final BuildTools buildTools = new BuildTools(project, rootProject.getProperties().getOrDefault("generate", "").toString())

	loom {
		accessWidenerPath = file("src/main/resources/minecraft-mappings.accesswidener")
	}

	dependencies {
		implementation project(":common")
		minecraft "com.mojang:minecraft:${buildTools.minecraftVersion}"
		// No mappings line — game jar is already official names
		implementation "net.fabricmc:fabric-loader:${buildTools.getFabricVersion()}"
		implementation "net.fabricmc.fabric-api:fabric-api:${buildTools.getFabricApiVersion()}"
		compileOnly "com.google.code.findbugs:jsr305:+"
		testImplementation "org.junit.jupiter:junit-jupiter-api:5.+"
		testImplementation "org.junit.platform:junit-platform-launcher:1.+"
		testImplementation "com.google.code.gson:gson:+"
		testImplementation "org.reflections:reflections:+"
		testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.+"
	}

	java {
		toolchain {
			languageVersion.set(JavaLanguageVersion.of(buildTools.javaLanguageVersion))
		}
		withSourcesJar()
		withJavadocJar()
	}

	// No remapJar on unobfuscated Loom — publish plain jar
	tasks.withType(AbstractArchiveTask).configureEach {
		preserveFileTimestamps = false
		reproducibleFileOrder = true
	}

	test {
		useJUnitPlatform()
		testLogging { showStandardStreams = true }
	}
}
