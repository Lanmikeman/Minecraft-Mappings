pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "0.9.0"
}

include("common")
include("fabric:26.1.2-mapping")
include("fabric:26.1.2-generator")

rootProject.name = "Minecraft-Mappings"
